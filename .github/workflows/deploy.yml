name: Deploy to Shuttle.rs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Shuttle
        uses: shuttle-hq/deploy-action@legacy
        with:
          deploy-key: ${{ secrets.SHUTTLE_API_KEY }}
          name: "kprsnt-in"
          cargo-shuttle-version: "0.48.0"
